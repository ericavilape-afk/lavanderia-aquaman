<!-- HEADER -->
<header class="bg-blue-600 text-white shadow-md">
  <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="text-3xl">🌊</div>
      <div>
        <h1 class="text-xl font-bold leading-tight">Lavandería Aquaman</h1>
        <p class="text-blue-200 text-xs">Sistema de recojo</p>
      </div>
    </div>
    <button id="btn-nuevo" type="button"
      class="bg-white text-blue-600 font-semibold px-4 py-2 rounded-lg text-sm hover:bg-blue-50 transition">
      + Nuevo pedido
    </button>
  </div>
  <div class="max-w-4xl mx-auto px-4 flex gap-0 border-t border-blue-500">
    <button type="button" id="nav-pedidos"
      class="nav-tab activo px-6 py-3 text-sm text-white">📋 Pedidos</button>
    <button type="button" id="nav-clientes"
      class="nav-tab px-6 py-3 text-sm text-blue-200">👥 Clientes</button>
  </div>
</header>

<!-- ══ SECCIÓN PEDIDOS ══ -->
<div id="sec-pedidos">
  <div class="search-row max-w-4xl mx-auto px-4 mt-6 flex gap-2">
    <div class="relative flex-1">
      <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">🔍</span>
      <input id="buscador" type="search" placeholder="Buscar por código de boleta o nombre..."
        class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 bg-white shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400 text-sm" />
    </div>
    <select id="orden"
      class="border border-slate-200 bg-white rounded-xl px-3 text-sm text-slate-600 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
      <option value="desc">Más reciente</option>
      <option value="asc">Más antiguo</option>
    </select>
  </div>
  <div class="max-w-4xl mx-auto px-4 mt-4">
    <div class="flex gap-2 flex-wrap">
      <button type="button" data-filtro="todos" id="tab-notif-todos" class="tab-btn px-4 py-1.5 rounded-full text-xs font-medium border transition">Todos</button>
      <button type="button" data-filtro="no"    id="tab-notif-no"   class="tab-btn px-4 py-1.5 rounded-full text-xs font-medium border transition">📵 Sin avisar</button>
      <button type="button" data-filtro="si"    id="tab-notif-si"   class="tab-btn px-4 py-1.5 rounded-full text-xs font-medium border transition">📨 Ya avisados</button>
    </div>
  </div>
  <div class="max-w-4xl mx-auto px-4 mt-2">
    <p id="contador" class="text-xs text-slate-400"></p>
  </div>
  <div id="lista-pedidos" class="max-w-4xl mx-auto px-4 mt-2 pb-20 space-y-3"></div>
  <div id="vacio-pedidos" class="hidden max-w-4xl mx-auto px-4 mt-16 text-center text-slate-400">

<!-- TOAST -->
<div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-sm px-5 py-3 rounded-xl shadow-lg z-50"></div>


<script>
// ─── SUPABASE REST (sin SDK) ─────────────────────────────────
const SUPA_URL = 'https://gdmgpfymwcfuryecccpy.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdkbWdwZnltd2NmdXJ5ZWNjY3B5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5ODMyNzQsImV4cCI6MjA5NTU1OTI3NH0.RFxMrMMcN12rTRk5QO281F5X1MP3A48dOUhhd0pXi84';
const SB_HEADERS = {
  apikey: SUPA_KEY,
  Authorization: 'Bearer ' + SUPA_KEY,
  'Content-Type': 'application/json',
  Accept: 'application/json',
  Prefer: 'return=representation'
};
const CACHE_KEY = 'aq-pedidos-v1';
const PAGE = 40;
const WA_ICO = '<svg class="wa-ico"><use href="#ico-wa"/></svg>';

let todosLosPedidos = [];
let cacheClientes = null;
let filtroNotif = 'todos';
let seccionActiva = 'pedidos';
let paginaP = PAGE;
let paginaC = PAGE;
let sugerenciasActuales = [];

async function sb(method, path, body) {
  const res = await fetch(SUPA_URL + '/rest/v1/' + path, {
    method,
    headers: SB_HEADERS,
    body: body !== undefined ? JSON.stringify(body) : undefined
  });
  if (!res.ok) throw new Error((await res.text()) || String(res.status));
  const t = await res.text();
  return t ? JSON.parse(t) : null;
}

// ─── CACHE ───────────────────────────────────────────────────
function leerCache() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    if (!raw) return null;
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : null;
  } catch { return null; }
}
let cacheTimer;
function guardarCache() {
  clearTimeout(cacheTimer);
  cacheTimer = setTimeout(() => {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(todosLosPedidos)); } catch {}
  }, 150);
}
function setPedidos(arr) {
  todosLosPedidos = arr;
  for (let i = 0; i < todosLosPedidos.length; i++) {
    const p = todosLosPedidos[i];
    p._t = p.created_at ? Date.parse(p.created_at) || 0 : 0;
  }
  cacheClientes = null;
}

// ─── LOADING ─────────────────────────────────────────────────
function showLoad() { document.getElementById('loading').classList.remove('hidden'); }
function hideLoad() { document.getElementById('loading').classList.add('hidden'); }

// ─── CARGAR DATOS ────────────────────────────────────────────
async function cargarDatos(silencio) {
  if (!silencio) showLoad();
  try {
    const data = await sb('GET', 'pedidos?select=*&order=created_at.desc');
    setPedidos(data || []);
    guardarCache();
  } catch (error) {
    mostrarToast('❌ Error al cargar datos');
    console.error(error);
  } finally {
    hideLoad();
  }
}

// ─── HELPERS ─────────────────────────────────────────────────
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, ch =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[ch]);
}
function inicial(nombre) {
  return esc((nombre || '?').trim().charAt(0).toUpperCase() || '?');
}
function fechaCorta(ts) {
  if (!ts) return '';
  return new Date(ts).toLocaleDateString('es-PE', { day:'2-digit', month:'short', year:'numeric' });
}
function fechaMes(ts) {
  if (!ts) return '';
  return new Date(ts).toLocaleDateString('es-PE', { month:'long', year:'numeric' });
}
function urlWA(c) {
  const tel = '51' + String(c.celular).replace(/\D/g,'');
  const msg = `Hola ${c.nombre} 👋, te avisamos que tu ropa de la *Lavandería Aquaman* ya está lavada, doblada y perfumada lista para recoger.🤩\n\n📋 Boleta: *${c.codigo}*\n\n¡Te esperamos! 🌊`;
  return `https://api.whatsapp.com/send?phone=${tel}&text=${encodeURIComponent(msg)}`;
}
function claveCliente(c) {
  return c.nombre.trim().toLowerCase() + '|' + String(c.celular).replace(/\D/g,'');
}
function debounce(fn, ms) {
  let t;
  return function () {
    clearTimeout(t);
    t = setTimeout(fn, ms);
  };
}
function badgeNotif(ok) {
  return ok
    ? '<span class="notif-si text-xs font-semibold px-2 py-0.5 rounded-full">📨 Avisado</span>'
    : '<span class="notif-no text-xs font-semibold px-2 py-0.5 rounded-full">📵 Sin avisar</span>';
}

function listaClientes() {
  if (cacheClientes) return cacheClientes;
  const mapa = Object.create(null);
  for (let i = 0; i < todosLosPedidos.length; i++) {
    const p = todosLosPedidos[i];
    const key = claveCliente(p);
    let c = mapa[key];
    if (!c) {
      c = mapa[key] = { nombre: p.nombre, celular: p.celular, pedidos: [], _t: 0 };
    }
    c.pedidos.push(p);
    if (p._t > c._t) c._t = p._t;
  }
  cacheClientes = Object.values(mapa);
  cacheClientes.sort((a, b) => b._t - a._t);
  return cacheClientes;
}

// ─── NAVEGACIÓN ───────────────────────────────────────────────
function irSeccion(sec) {
  seccionActiva = sec;
  document.getElementById('sec-pedidos').classList.toggle('hidden', sec !== 'pedidos');
  document.getElementById('sec-clientes').classList.toggle('hidden', sec !== 'clientes');
  document.getElementById('nav-pedidos').classList.toggle('activo', sec === 'pedidos');
  document.getElementById('nav-clientes').classList.toggle('activo', sec === 'clientes');
  document.getElementById('nav-pedidos').classList.toggle('text-white', sec === 'pedidos');
  document.getElementById('nav-pedidos').classList.toggle('text-blue-200', sec !== 'pedidos');
  document.getElementById('nav-clientes').classList.toggle('text-white', sec === 'clientes');
  document.getElementById('nav-clientes').classList.toggle('text-blue-200', sec !== 'clientes');
  document.getElementById('btn-nuevo').style.display = sec === 'pedidos' ? '' : 'none';
  if (sec === 'clientes') renderClientes();
  else renderPedidos();
}

// ─── RENDER PEDIDOS ───────────────────────────────────────────
function filtrarPedidos() {
  const q = document.getElementById('buscador').value.toLowerCase().trim();
  const orden = document.getElementById('orden').value;
  let datos = todosLosPedidos;
  if (filtroNotif === 'si') datos = datos.filter(c => c.notificado);
  else if (filtroNotif === 'no') datos = datos.filter(c => !c.notificado);
  if (q) {
    datos = datos.filter(c =>
      String(c.codigo).toLowerCase().includes(q) || String(c.nombre).toLowerCase().includes(q));
  }
  const copia = datos.slice();
  copia.sort((a, b) => orden === 'desc' ? b._t - a._t : a._t - b._t);
  return copia;
}

function cardPedido(c) {
  const id = esc(c.id);
  return `<div class="card-row bg-white rounded-xl border shadow-sm px-5 py-4 flex items-center gap-3 fade-in cursor-pointer hover:shadow-md transition ${c.notificado ? 'border-slate-100' : 'border-orange-100'}" data-id="${id}">
    <div class="flex-1 min-w-0">
      <div class="flex items-center gap-1.5 flex-wrap">
        <span class="font-mono text-sm font-bold text-blue-600">${esc(c.codigo)}</span>
        ${badgeNotif(c.notificado)}
      </div>
      <p class="font-semibold text-slate-800 mt-0.5 truncate">${esc(c.nombre)}</p>
      <p class="text-xs text-slate-400 mt-0.5">📅 ${fechaCorta(c.created_at)}${c.nota ? ' · ' + esc(c.nota) : ''}${c.fecha_aviso ? ' · ✉️ avisado ' + esc(c.fecha_aviso) : ''}</p>
    </div>
    <a href="${urlWA(c)}" target="_blank" rel="noopener" data-aviso="${id}"
      class="wa-btn ${c.notificado ? 'wa-btn-reenviar' : 'wa-btn-nuevo'} shrink-0">${WA_ICO} ${c.notificado ? 'Reenviar' : 'Avisar recojo'}</a>
  </div>`;
}

function renderPedidos() {
  const lista = document.getElementById('lista-pedidos');
  const vacio = document.getElementById('vacio-pedidos');
  const datos = filtrarPedidos();
  let sinAvisar = 0;
  for (let i = 0; i < todosLosPedidos.length; i++) if (!todosLosPedidos[i].notificado) sinAvisar++;
  document.getElementById('contador').textContent =
    `${datos.length} pedido${datos.length !== 1 ? 's' : ''} · ${sinAvisar} sin avisar`;

  if (datos.length === 0) {
    lista.innerHTML = '';
    vacio.classList.remove('hidden');
    return;
  }
  vacio.classList.add('hidden');
  const slice = datos.slice(0, paginaP);
  let html = '';
  for (let i = 0; i < slice.length; i++) html += cardPedido(slice[i]);
  if (datos.length > slice.length) {
    html += `<button type="button" id="btn-mas-p" class="w-full py-3 text-sm font-medium text-blue-600 bg-white border border-slate-200 rounded-xl hover:bg-blue-50">Cargar más (${datos.length - slice.length} restantes)</button>`;
  }
  lista.innerHTML = html;
}

// ─── RENDER CLIENTES ─────────────────────────────────────────
function renderClientes() {
  const lista = document.getElementById('lista-clientes');
  const vacio = document.getElementById('vacio-clientes');
  const q = document.getElementById('buscador-cli').value.toLowerCase().trim();
  let clientes = listaClientes();
  if (q) {
    clientes = clientes.filter(c =>
      c.nombre.toLowerCase().includes(q) || String(c.celular).includes(q));
  }

  document.getElementById('contador-cli').textContent =
    `${clientes.length} cliente${clientes.length !== 1 ? 's' : ''} · ${todosLosPedidos.length} pedidos en total`;

  if (clientes.length === 0) {
    lista.innerHTML = '';
    vacio.classList.remove('hidden');
    return;
  }
  vacio.classList.add('hidden');
  const slice = clientes.slice(0, paginaC);
  let html = '';
  for (let i = 0; i < slice.length; i++) {
    const c = slice[i];
    const total = c.pedidos.length;
    let sinAvisar = 0;
    for (let j = 0; j < total; j++) if (!c.pedidos[j].notificado) sinAvisar++;
    html += `<div class="card-row bg-white rounded-xl border border-slate-100 shadow-sm px-5 py-4 flex items-center gap-4 fade-in cursor-pointer hover:shadow-md transition" data-cli="${esc(claveCliente(c))}">
      <div class="w-11 h-11 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold text-lg shrink-0">${inicial(c.nombre)}</div>
      <div class="flex-1 min-w-0">
        <p class="font-semibold text-slate-800 truncate">${esc(c.nombre)}</p>
        <p class="text-xs text-slate-400">+51 ${esc(c.celular)} · último pedido: ${fechaCorta(c.pedidos.find(p => p._t === c._t)?.created_at || c.pedidos[0].created_at)}</p>
      </div>
      <div class="text-right shrink-0">
        <p class="text-lg font-bold text-blue-600">${total}</p>
        <p class="text-xs text-slate-400">${total === 1 ? 'pedido' : 'pedidos'}</p>
        ${sinAvisar > 0
          ? `<p class="text-xs text-orange-500 font-semibold">${sinAvisar} sin avisar</p>`
          : '<p class="text-xs text-green-600">todos avisados</p>'}
      </div>
    </div>`;
  }
  if (clientes.length > slice.length) {
    html += `<button type="button" id="btn-mas-c" class="w-full py-3 text-sm font-medium text-blue-600 bg-white border border-slate-200 rounded-xl hover:bg-blue-50">Cargar más (${clientes.length - slice.length} restantes)</button>`;
  }
  lista.innerHTML = html;
}

// ─── MODAL DETALLE CLIENTE ────────────────────────────────────
function abrirModalCliente(c) {
  document.getElementById('cli-titulo').textContent = c.nombre;

  const porMes = {};
  for (let i = 0; i < c.pedidos.length; i++) {
    const p = c.pedidos[i];
    const mes = fechaMes(p.created_at);
    if (!porMes[mes]) porMes[mes] = [];
    porMes[mes].push(p);
  }
  const meses = Object.keys(porMes).sort((a, b) => {
    const maxA = Math.max.apply(null, porMes[a].map(p => p._t));
    const maxB = Math.max.apply(null, porMes[b].map(p => p._t));
    return maxB - maxA;
  });

  const total = c.pedidos.length;
  let avisados = 0;
  for (let i = 0; i < total; i++) if (c.pedidos[i].notificado) avisados++;

  let html = `
    <div class="flex items-center gap-4 bg-blue-50 rounded-xl px-4 py-3">
      <div class="w-12 h-12 rounded-full bg-blue-600 flex items-center justify-center text-white font-bold text-xl">${inicial(c.nombre)}</div>
      <div>
        <p class="font-semibold text-slate-800">${esc(c.nombre)}</p>
        <p class="text-sm text-slate-500">+51 ${esc(c.celular)}</p>
      </div>
    </div>
    <div class="grid grid-cols-3 gap-3 text-center">
      <div class="bg-slate-50 rounded-xl py-3">
        <p class="text-2xl font-bold text-blue-600">${total}</p>
        <p class="text-xs text-slate-400">Pedidos</p>
      </div>
      <div class="bg-slate-50 rounded-xl py-3">
        <p class="text-2xl font-bold text-green-600">${avisados}</p>
        <p class="text-xs text-slate-400">Avisados</p>
      </div>
      <div class="bg-slate-50 rounded-xl py-3">
        <p class="text-2xl font-bold text-orange-500">${total - avisados}</p>
        <p class="text-xs text-slate-400">Sin avisar</p>
      </div>
    </div>
    <p class="text-xs text-slate-400 font-semibold uppercase tracking-wide">Historial de pedidos</p>`;

  for (let m = 0; m < meses.length; m++) {
    const mes = meses[m];
    const pedidos = porMes[mes].slice().sort((a, b) => b._t - a._t);
    html += `<div>
      <p class="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2 capitalize">${esc(mes)}</p>
      <div class="space-y-2">`;
    for (let i = 0; i < pedidos.length; i++) {
      const p = pedidos[i];
      html += `
        <div class="flex items-center gap-3 bg-slate-50 rounded-lg px-3 py-2.5 cursor-pointer hover:bg-slate-100 transition" data-pid="${esc(p.id)}">
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-1.5 flex-wrap">
              <span class="font-mono text-sm font-bold text-blue-600">${esc(p.codigo)}</span>
              ${badgeNotif(p.notificado)}
            </div>
            <p class="text-xs text-slate-400 mt-0.5">📅 ${fechaCorta(p.created_at)}${p.nota ? ' · ' + esc(p.nota) : ''}</p>
          </div>
          <a href="${urlWA(p)}" target="_blank" rel="noopener" data-aviso="${esc(p.id)}"
             class="wa-btn ${p.notificado ? 'wa-btn-reenviar' : 'wa-btn-nuevo'} shrink-0 text-xs px-2 py-1.5">
            ${WA_ICO} ${p.notificado ? 'Reenviar' : 'Avisar'}
          </a>
        </div>`;
    }
    html += '</div></div>';
  }

  document.getElementById('cli-contenido').innerHTML = html;
  document.getElementById('modal-cliente').classList.remove('hidden');
}
function cerrarModalCliente() {
  document.getElementById('modal-cliente').classList.add('hidden');
}

// ─── REGISTRAR AVISO ─────────────────────────────────────────
async function registrarAviso(id) {
  const fecha = new Date().toLocaleDateString('es-PE', { day:'2-digit', month:'short' });
  try {
    await sb('PATCH', 'pedidos?id=eq.' + encodeURIComponent(id), { notificado: true, fecha_aviso: fecha });
  } catch (error) {
    mostrarToast('❌ Error al guardar');
    return;
  }
  const idx = todosLosPedidos.findIndex(x => x.id === id);
  if (idx >= 0) {
    todosLosPedidos[idx].notificado = true;
    todosLosPedidos[idx].fecha_aviso = fecha;
  }
  cacheClientes = null;
  guardarCache();
  renderPedidos();
  if (seccionActiva === 'clientes') renderClientes();
  const det = document.getElementById('modal-detalle');
  if (!det.classList.contains('hidden')) abrirDetalle(id);
  mostrarToast('✅ Aviso enviado por WhatsApp');
}

// ─── SUGERENCIAS ─────────────────────────────────────────────
function sugerirCliente(q) {
  const box = document.getElementById('sugerencias');
  if (!q || q.length < 2) { box.classList.add('hidden'); return; }
  const ql = q.toLowerCase();
  const matches = listaClientes().filter(c => c.nombre.toLowerCase().includes(ql)).slice(0, 4);
  if (!matches.length) { box.classList.add('hidden'); return; }
  sugerenciasActuales = matches;
  box.innerHTML = matches.map((c, i) => `
    <div data-sug="${i}" class="px-3 py-2 text-sm hover:bg-blue-50 cursor-pointer border-b border-slate-100 last:border-0">
      <span class="font-medium text-slate-800">${esc(c.nombre)}</span>
      <span class="text-slate-400 text-xs ml-2">+51 ${esc(c.celular)}</span>
    </div>`).join('');
  box.classList.remove('hidden');
}
function elegirCliente(i) {
  const c = sugerenciasActuales[i];
  if (!c) return;
  document.getElementById('f-nombre').value = c.nombre;
  document.getElementById('f-celular').value = c.celular;
  document.getElementById('sugerencias').classList.add('hidden');
}

// ─── FILTROS ─────────────────────────────────────────────────
function setFiltroP(valor) {
  filtroNotif = valor;
  paginaP = PAGE;
  document.querySelectorAll('[id^="tab-notif-"]').forEach(b => b.classList.remove('tab-activo'));
  document.getElementById('tab-notif-' + valor).classList.add('tab-activo');
  renderPedidos();
}

// ─── MODAL PEDIDO ─────────────────────────────────────────────
function abrirModalNuevo() {
  document.getElementById('modal-titulo').textContent = 'Nuevo pedido';
  document.getElementById('edit-id').value = '';
  document.getElementById('form-cliente').reset();
  document.getElementById('sugerencias').classList.add('hidden');
  document.getElementById('modal').classList.remove('hidden');
  setTimeout(() => document.getElementById('f-codigo').focus(), 50);
}
function abrirModalEditar(id) {
  const c = todosLosPedidos.find(x => x.id === id);
  if (!c) return;
  document.getElementById('modal-titulo').textContent = 'Editar pedido';
  document.getElementById('edit-id').value = c.id;
  document.getElementById('f-codigo').value = c.codigo;
  document.getElementById('f-nombre').value = c.nombre;
  document.getElementById('f-celular').value = c.celular;
  document.getElementById('f-nota').value = c.nota || '';
  cerrarDetalle();
  document.getElementById('modal').classList.remove('hidden');
}
function cerrarModal() { document.getElementById('modal').classList.add('hidden'); }

async function guardarPedido(e) {
  e.preventDefault();
  const btn = document.getElementById('btn-guardar');
  btn.disabled = true; btn.textContent = 'Guardando...';

  const editId = document.getElementById('edit-id').value;
  const celular = document.getElementById('f-celular').value.trim().replace(/\D/g,'');
  const payload = {
    codigo: document.getElementById('f-codigo').value.trim().toUpperCase(),
    nombre: document.getElementById('f-nombre').value.trim(),
    celular,
    nota: document.getElementById('f-nota').value.trim(),
  };

  try {
    if (editId) {
      const rows = await sb('PATCH', 'pedidos?id=eq.' + encodeURIComponent(editId), payload);
      const row = rows && rows[0];
      const idx = todosLosPedidos.findIndex(x => x.id === editId);
      if (idx >= 0) {
        Object.assign(todosLosPedidos[idx], row || payload);
        todosLosPedidos[idx]._t = todosLosPedidos[idx].created_at ? Date.parse(todosLosPedidos[idx].created_at) || 0 : todosLosPedidos[idx]._t;
      }
    } else {
      payload.id = Date.now().toString();
      payload.notificado = false;
      payload.fecha_aviso = null;
      const rows = await sb('POST', 'pedidos', payload);
      const row = (rows && rows[0]) || { ...payload, created_at: new Date().toISOString() };
      row._t = row.created_at ? Date.parse(row.created_at) || Date.now() : Date.now();
      todosLosPedidos.unshift(row);
    }
    cacheClientes = null;
    guardarCache();
    cerrarModal();
    paginaP = PAGE;
    renderPedidos();
    mostrarToast(editId ? '✏️ Pedido actualizado' : '✅ Pedido guardado');
  } catch (error) {
    mostrarToast('❌ Error al guardar');
    console.error(error);
  } finally {
    btn.disabled = false; btn.textContent = 'Guardar';
  }
}

// ─── DETALLE PEDIDO ───────────────────────────────────────────
function abrirDetalle(id) {
  const c = todosLosPedidos.find(x => x.id === id);
  if (!c) return;

  const notifInfo = c.notificado
    ? `<div class="flex items-center gap-2 bg-green-50 border border-green-100 rounded-lg px-3 py-2">
         <span class="text-green-600 text-lg">📨</span>
         <div><p class="text-sm font-semibold text-green-700">Ya fue avisado</p>
         ${c.fecha_aviso ? `<p class="text-xs text-green-500">el ${esc(c.fecha_aviso)}</p>` : ''}</div>
       </div>`
    : `<div class="flex items-center gap-2 bg-orange-50 border border-orange-100 rounded-lg px-3 py-2">
         <span class="text-orange-500 text-lg">📵</span>
         <p class="text-sm font-semibold text-orange-600">Aún no fue avisado</p>
       </div>`;

  const idEsc = esc(c.id);
  const btnWA = `<a href="${urlWA(c)}" target="_blank" rel="noopener" data-aviso="${idEsc}"
          class="wa-btn ${c.notificado ? 'wa-btn-reenviar' : 'wa-btn-nuevo'} flex-1 py-2.5 text-sm rounded-lg">${WA_ICO} ${c.notificado ? 'Reenviar aviso' : 'Avisar recojo por WhatsApp'}</a>`;

  document.getElementById('detalle-contenido').innerHTML = `
    <div class="flex items-center gap-2 flex-wrap">
      <span class="font-mono text-2xl font-bold text-blue-600">${esc(c.codigo)}</span>
    </div>
    ${notifInfo}
    <div class="space-y-2 text-sm">
      <div><span class="text-slate-400">Cliente:</span> <span class="font-semibold text-slate-800">${esc(c.nombre)}</span></div>
      <div><span class="text-slate-400">Celular:</span> <span class="text-slate-800">+51 ${esc(c.celular)}</span></div>
      <div><span class="text-slate-400">Ingreso:</span> <span class="text-slate-700">📅 ${fechaCorta(c.created_at)}</span></div>
      ${c.nota ? `<div><span class="text-slate-400">Nota:</span> <span class="text-slate-700">${esc(c.nota)}</span></div>` : ''}
    </div>
    <div class="flex gap-2">${btnWA}</div>
    <div class="flex gap-2">
      <button type="button" data-editar="${idEsc}"
        class="flex-1 border border-slate-200 text-slate-600 rounded-lg py-2 text-sm font-medium hover:bg-slate-50">Editar</button>
      <button type="button" data-borrar="${idEsc}"
        class="flex-1 border border-red-100 text-red-500 rounded-lg py-2 text-sm font-medium hover:bg-red-50">Eliminar</button>
    </div>`;
  document.getElementById('modal-detalle').classList.remove('hidden');
}
function cerrarDetalle() { document.getElementById('modal-detalle').classList.add('hidden'); }

async function eliminarPedido(id) {
  if (!confirm('¿Eliminar este pedido?')) return;
  try {
    await sb('DELETE', 'pedidos?id=eq.' + encodeURIComponent(id));
  } catch (error) {
    mostrarToast('❌ Error al eliminar');
    return;
  }
  todosLosPedidos = todosLosPedidos.filter(x => x.id !== id);
  cacheClientes = null;
  guardarCache();
  cerrarDetalle();
  renderPedidos();
  if (seccionActiva === 'clientes') renderClientes();
}

// ─── TOAST ────────────────────────────────────────────────────
let toastTimer;
function mostrarToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add('hidden'), 2500);
}

// ─── EVENTOS ─────────────────────────────────────────────────
document.getElementById('btn-nuevo').addEventListener('click', abrirModalNuevo);
document.getElementById('nav-pedidos').addEventListener('click', () => irSeccion('pedidos'));
document.getElementById('nav-clientes').addEventListener('click', () => irSeccion('clientes'));
document.getElementById('buscador').addEventListener('input', debounce(() => { paginaP = PAGE; renderPedidos(); }, 80));
document.getElementById('buscador-cli').addEventListener('input', debounce(() => { paginaC = PAGE; renderClientes(); }, 80));
document.getElementById('orden').addEventListener('change', () => { paginaP = PAGE; renderPedidos(); });
document.querySelectorAll('[data-filtro]').forEach(b => b.addEventListener('click', () => setFiltroP(b.dataset.filtro)));
document.getElementById('form-cliente').addEventListener('submit', guardarPedido);
document.getElementById('f-nombre').addEventListener('input', e => sugerirCliente(e.target.value));
document.getElementById('sugerencias').addEventListener('click', e => {
  const row = e.target.closest('[data-sug]');
  if (row) elegirCliente(Number(row.dataset.sug));
});

document.getElementById('lista-pedidos').addEventListener('click', e => {
  if (e.target.closest('#btn-mas-p')) { paginaP += PAGE; renderPedidos(); return; }
  const aviso = e.target.closest('[data-aviso]');
  if (aviso) { registrarAviso(aviso.dataset.aviso); return; }
  const card = e.target.closest('[data-id]');
  if (card) abrirDetalle(card.dataset.id);
});

document.getElementById('lista-clientes').addEventListener('click', e => {
  if (e.target.closest('#btn-mas-c')) { paginaC += PAGE; renderClientes(); return; }
  const card = e.target.closest('[data-cli]');
  if (!card) return;
  const c = listaClientes().find(x => claveCliente(x) === card.dataset.cli);
  if (c) abrirModalCliente(c);
});

document.getElementById('cli-contenido').addEventListener('click', e => {
  const aviso = e.target.closest('[data-aviso]');
  if (aviso) { registrarAviso(aviso.dataset.aviso); return; }
  const row = e.target.closest('[data-pid]');
  if (row) { cerrarModalCliente(); abrirDetalle(row.dataset.pid); }
});

document.getElementById('detalle-contenido').addEventListener('click', e => {
  const aviso = e.target.closest('[data-aviso]');
  if (aviso) { registrarAviso(aviso.dataset.aviso); return; }
  const ed = e.target.closest('[data-editar]');
  if (ed) { abrirModalEditar(ed.dataset.editar); return; }
  const bor = e.target.closest('[data-borrar]');
  if (bor) eliminarPedido(bor.dataset.borrar);
});

document.addEventListener('click', e => {
  if (e.target.closest('[data-close]')) {
    const tipo = e.target.closest('[data-close]').dataset.close;
    if (tipo === 'pedido') cerrarModal();
    else if (tipo === 'detalle') cerrarDetalle();
    else if (tipo === 'cliente') cerrarModalCliente();
    return;
  }
  if (!e.target.closest('#f-nombre') && !e.target.closest('#sugerencias'))
    document.getElementById('sugerencias').classList.add('hidden');
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { cerrarModal(); cerrarDetalle(); cerrarModalCliente(); }
});
['modal','modal-detalle','modal-cliente'].forEach(mid => {
  document.getElementById(mid).addEventListener('click', e => {
    if (e.target.id === mid) { cerrarModal(); cerrarDetalle(); cerrarModalCliente(); }
  });
});

// ─── INIT ─────────────────────────────────────────────────────
setFiltroP('todos');
const cached = leerCache();
if (cached && cached.length) {
  setPedidos(cached);
  renderPedidos();
  cargarDatos(true).then(() => {
    if (seccionActiva === 'clientes') renderClientes();
    else renderPedidos();
  });
} else {
  cargarDatos().then(() => renderPedidos());
}
</script>
</body>
</html>
